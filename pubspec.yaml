name: kuaxue
description: "Macura - AI Learning Agent by Makur"
publish_to: 'none'
version: 1.8.1+10

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 网络请求
  dio: ^5.7.0
  # 哈希
  crypto: ^3.0.6
  # 状态管理
  flutter_riverpod: ^2.6.1
  # Markdown 渲染
  flutter_markdown: ^0.7.6
  # 本地存储
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  # 图片选择
  image_picker: ^1.1.2
  # 文件选择
  file_picker: ^10.0.0
  # 文本提取
  syncfusion_flutter_pdf: ^27.1.0
  docx_to_text: ^1.0.0
  # 录音
  record: ^6.0.0
  # JSON 序列化
  json_annotation: ^4.9.0
  # 本地通知
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.0
  # 分享
  share_plus: ^10.0.0
  # 网络状态
  connectivity_plus: ^6.0.0
  # UUID
  uuid: ^4.5.1
  # 日期格式化
  intl: ^0.19.0
  # 文件操作 - 后续添加
  # URL 启动
  url_launcher: ^6.3.1
  # 打开文件（安装 APK）
  open_filex: ^4.7.0
  # 应用信息
  package_info_plus: ^8.0.0
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logonew.png"
  adaptive_icon_background: "#22B889"
  adaptive_icon_foreground: "assets/logonew.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
